apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  replicas: 3
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/mspr2-2026/frontend:latest
          imagePullPolicy: "Always"
          ports:
            - containerPort: 80
          env:
            - name: OPENFAAS_GATEWAY_URL
              value: "http://gateway.openfaas:8080"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
